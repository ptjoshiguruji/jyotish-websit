<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jyotish Purohit Guruji</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#111;
}

.card{
    max-width:420px;
    margin:20px auto;
    background:linear-gradient(to bottom,#3b1f0f,#140b06);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    color:#fff;
    overflow:hidden;
}

.top{
    text-align:center;
    padding:25px 15px;
}

.top img{
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #d4a24c;
}

.title-marathi{
    font-size:26px;
    font-weight:bold;
    color:#f5c76a;
    margin-top:15px;
}

.title-eng{
    font-size:18px;
    margin-top:5px;
}

.tagline{
    font-size:14px;
    color:#ddd;
    margin-top:5px;
}

.info{
    padding:15px 25px;
}

.info div{
    display:flex;
    align-items:center;
    margin:10px 0;
    font-size:15px;
}

.info span{
    margin-left:10px;
}

.buttons{
    padding:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn{
    text-decoration:none;
    color:#fff;
    padding:12px;
    border-radius:30px;
    text-align:center;
    font-weight:bold;
}

.call{background:#2ecc71;}
.whatsapp{background:#25D366;}
.fb{background:#1877F2;}
.insta{background:#E1306C;}

.location{
    text-align:center;
    padding:15px;
    font-size:14px;
    color:#f5c76a;
    border-top:1px solid rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="card">

    <div class="top">
        <!-- तुमचा फोटो -->
        <img src="photo.jpg" alt="Jyotish Guruji">

        <div class="title-marathi">ज्योतिषी पुरोहित गुरुजी</div>
        <div class="title-eng">Jyotish Purohit Guruji</div>
        <div class="tagline">॥ कुंडली • वास्तु • उपाय मार्गदर्शन ॥</div>
    </div>

    <div class="info">
        <div>📞 <span>8080004202</span></div>
        <div>💬 <span>WhatsApp: 8080004202</span></div>
        <div>📸 <span>@pt.joshiguruji</span></div>
    </div>

    <div class="buttons">
        <a href="tel:8080004202" class="btn call">Call Now</a>
        <a href="https://wa.me/918080004202" class="btn whatsapp">WhatsApp</a>
        <a href="https://www.instagram.com/pt.joshiguruji" class="btn insta">Instagram</a>
        <a href="#" class="btn fb">Facebook</a>
    </div>

    <div class="location">📍 Maharashtra, India</div>

</div>

</body>
</html>
