<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री स्वामी समर्थ ज्योतिष मार्गदर्शन केंद्र</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap');

        body {
            font-family: 'Baloo 2', cursive;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            color: #fff;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-top: 30px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #fff;
        }

        h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .contact-number {
            font-size: 1.8em;
            font-weight: 700;
            margin: 15px 0;
            color: #ffd700;
        }

        .tip {
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .buttons a {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 1.8em;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
        }

        .buttons a:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .whatsapp { background-color: #25D366; }
        .instagram { 
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
        .call { background-color: #34B7F1; }

        .service-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            text-align: left;
        }

        .service-card p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .service-card i {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- मुख्य कार्ड -->
        <div class="card">
            <h1>पंडित जोशी गुरुजी</h1>
            <h2>महाराष्ट्राचे सुप्रसिद्ध ज्योतिषी</h2>

            <div class="contact-number">8080004202</div>
            <div class="tip">(टीप: आपली सर्व माहिती गुपित राहील)</div>

            <!-- बटन्स -->
            <div class="buttons">
                <a href="https://wa.me/918080004202" target="_blank" class="whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com/pt.joshiguruji" target="_blank" class="instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="tel:+918080004202" class="call">
                    <i class="fas fa-phone"></i>
                </a>
            </div>

            <p>संपर्क साधण्यासाठी वरील गोष्टींचा वापर करा</p>
        </div>

        <!-- सेवा कार्ड -->
        <div class="service-card">
            <p><i class="fas fa-globe"></i> कुंडली मार्गदर्शन</p>
            <p><i class="fas fa-ring"></i> विवाह अडचणी</p>
            <p><i class="fas fa-briefcase"></i> नोकरी / व्यवसाय समस्या</p>
            <p><i class="fas fa-heart"></i> प्रेम विवाह</p>
        </div>
    </div>
</body>
</html>
